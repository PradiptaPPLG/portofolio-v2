<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portofolio-v2</title>
  </head>
  <body>
    <div id="error-overlay" style="position: fixed; top: 0; left: 0; right: 0; background: red; color: white; padding: 20px; z-index: 99999; display: none; font-family: monospace; white-space: pre-wrap;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.textContent = msg + '\n' + (error && error.stack ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.textContent = 'Unhandled promise rejection: ' + event.reason;
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
